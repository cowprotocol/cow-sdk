# Use the public npm registry for unscoped dependencies.
registries:
  default: https://registry.npmjs.org/

# Prefer cached data, but fetch anything missing.
preferOffline: true

# Quarantine new third-party releases; keep this aligned with Renovate.
minimumReleaseAge: 20160 # 14 days
minimumReleaseAgeExclude:
  - '@cowprotocol/*'

# Reject transitive dependencies from git or direct tarball URLs.
blockExoticSubdeps: true

# Protect age-exempt packages from weaker publisher evidence during the same window.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 20160 # 14 days

# Explicitly skip dependency lifecycle scripts currently present in the lockfile.
allowBuilds:
  '@swc/core': false
  bigint-buffer: false
  bufferutil: false
  es5-ext: false
  esbuild: false
  utf-8-validate: false

packages:
  - 'packages/*'
  - 'packages/*/*'
  - 'examples/*/*'
  - '!**/dist' # exclude dist directories to avoid build artifacts being treated as packages

# rpc-websockets (a transitive @solana/web3.js dependency) pulls in uuid@14, which is ESM-only
# and breaks under Jest's CJS runtime ("ERR_REQUIRE_ESM"). Pin the whole tree to 9.0.1, the
# version @cowprotocol/cow-sdk and @cowprotocol/sdk-composable already depend on directly.
overrides:
  uuid: '9.0.1'
